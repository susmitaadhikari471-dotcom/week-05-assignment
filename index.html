<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adhikari Susmita Online Business Card</title>
    <!-- External CSS connection (S1 demo core) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="main-title">Adhikari Susmita's Profile</h1>
    </header>
    
    <main>
        <p class="alert-text"><strong>Notice:</strong> Welcome to my online business card!</p>

        <div class="card">
            <svg width="150" height="150" xmlns="http://www.w3.org/2000/svg">
                <rect width="100%" height="100%" fill="#cccccc"/>
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20px" fill="#666666">Photo</text>
            </svg>
            <h2>Adhikari Susmita</h2>
            <p>I am a basic coding beginner exploring the world of web programming.</p>
            <p>You can send me an email below.</p>
            
            <form>
                <label for="visitor-email">Email Address:</label>
                <input type="email" id="visitor-email" placeholder="example@stu.ac.kr">
                <button type="submit">Contact Me</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Adhikari Susmita</p>
    </footer>

</body>
</html>
